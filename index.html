<!doctype html>
<html lang="en" data-mode="wise" data-view="term">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moses Saruni</title>
  <meta name="description" content="Moses Saruni designs and builds WhatsApp platforms, AI agents and web apps in Nairobi. A portfolio you can use as a terminal." />
  <meta name="author" content="Moses Saruni" />
  <meta property="og:title" content="Moses Saruni" />
  <meta property="og:description" content="WhatsApp platforms, AI agents and web apps. Open the terminal, or don't." />
  <meta property="og:image" content="/icon.png" />
  <meta property="og:url" content="https://saruni-portfolio.netlify.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <a class="skip" href="#gui" id="skip">Skip to the plain page</a>

  <div id="deploy" hidden aria-hidden="true">
    <pre></pre>
    <p class="deploy-skip">Press any key to skip</p>
  </div>

  <main>
    <section id="term" aria-label="Terminal" data-xray="Terminal · src/terminal.js">
      <div class="term-scroll">
        <div id="term-out" role="log" aria-live="polite"></div>
        <form id="term-form" class="term-line" autocomplete="off">
          <label for="term-in" class="prompt">saruni@portfolio:~$</label>
          <input id="term-in" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Type a command, or type help" />
        </form>
      </div>
      <div class="chips" id="term-chips" data-xray="Command buttons · src/terminal.js"></div>
    </section>

    <div id="gui" tabindex="-1" data-xray="Plain page · src/gui.js"></div>
  </main>

  <nav id="status" aria-label="Views and modes" data-xray="Status bar · src/main.js"></nav>
  <aside id="xray-log" hidden></aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
